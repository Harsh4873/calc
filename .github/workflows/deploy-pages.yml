name: Deploy Calc to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/favicon.svg
          test -f dist/app-icon.svg
          test -f dist/social-card.svg
          test -f dist/manifest.webmanifest
          test -d dist/assets
          find dist/assets -type f -name '*.js' -print -quit | grep -q .
          find dist/assets -type f -name '*.css' -print -quit | grep -q .
          grep -Fq 'src="/calc/assets/' dist/index.html
          grep -Fq 'href="/calc/assets/' dist/index.html
          grep -Fq 'href="/calc/manifest.webmanifest"' dist/index.html
          grep -Fq 'href="/calc/favicon.svg"' dist/index.html
          grep -Fq 'href="https://harsh.bet/calc/"' dist/index.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/manifest.webmanifest', 'utf8'));
          if (manifest.id !== '/calc/' || manifest.start_url !== '/calc/' || manifest.scope !== '/calc/') {
            throw new Error('Calc manifest paths must stay rooted at /calc/.');
          }
          if (!(manifest.icons ?? []).some((icon) => icon.src === '/calc/app-icon.svg')) {
            throw new Error('Calc manifest is missing its app icon.');
          }
          NODE
          test ! -e CNAME
          test ! -e dist/CNAME
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
